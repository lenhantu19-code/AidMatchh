<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AidMatch - Chỉnh sửa nhu cầu hỗ trợ – NC-024</title>
    <link rel="stylesheet" href="dvcht2.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <i class="fa-solid fa-hands-holding-child"></i>
                <span class="logo-text">AidMatch</span>
                <span class="logo-sub">CỨU TRỢ THÔNG MINH</span>
            </div>
        </div>
        <div class="header-right">
            <div class="header-badge">
                <i class="fa-solid fa-database"></i> Dữ liệu minh họa
            </div>
            <button class="icon-btn">
                <i class="fa-regular fa-bell"></i>
            </button>
            <div class="user-profile">
                <div class="avatar">NL</div>
                <div class="user-info">
                    <span class="name">Nguyễn Lan</span>
                    <span class="role">Trạm An Bình (TC-001)</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        
        <!-- Breadcrumb & Workspace -->
        <main class="workspace">
            
            <div class="breadcrumb">
                KHÔNG GIAN LÀM VIỆC / ĐƠN VỊ CẦN HỖ TRỢ / CHỈNH SỬA NHU CẦU
            </div>

            <!-- Main Form Card -->
            <div class="form-card">
                
                <div class="form-card-header">
                    <h2>Chỉnh sửa nhu cầu hỗ trợ – NC-024</h2>
                    <span class="status-badge"><i class="fa-solid fa-check"></i> Đã xác minh (Đợt 10/10)</span>
                </div>

                <div class="form-grid">
                    <!-- Tên nhu cầu hỗ trợ -->
                    <div class="form-group full-width">
                        <label>Tên nhu cầu hỗ trợ *</label>
                        <input type="text" class="form-control" value="500 bộ nhu yếu phẩm cho đồng bào vùng lũ">
                    </div>

                    <!-- Mã định danh -->
                    <div class="form-group">
                        <label>Mã định danh (ID) *</label>
                        <input type="text" class="form-control" value="NC-024" readonly>
                    </div>

                    <!-- Đơn vị tiếp nhận -->
                    <div class="form-group full-width">
                        <label>Đơn vị tiếp nhận / Tổ chức *</label>
                        <input type="text" class="form-control" value="Trạm hỗ trợ cộng đồng An Bình">
                    </div>

                    <!-- Số lượng yêu cầu & Đã tiếp nhận -->
                    <div class="form-group half-width">
                        <label>Số lượng yêu cầu *</label>
                        <input type="text" class="form-control" value="500 bộ">
                    </div>
                    <div class="form-group half-width">
                        <label>Đã tiếp nhận</label>
                        <input type="text" class="form-control" value="300 bộ">
                    </div>

                    <!-- Khu vực / Địa bàn -->
                    <div class="form-group full-width">
                        <label>Khu vực / Địa bàn *</label>
                        <input type="text" class="form-control" value="Xã Hải An, Huyện Hải Lăng, Quảng Trị">
                    </div>

                    <!-- Trạng thái xử lý nguồn lực -->
                    <div class="form-group full-width">
                        <label>Trạng thái xử lý nguồn lực *</label>
                        <input type="text" class="form-control" value="Đang phân bổ (60% hoàn thành)">
                    </div>

                    <!-- Tài liệu & Giấy tờ minh chứng đính kèm -->
                    <div class="form-group full-width">
                        <label>Tài liệu & Giấy tờ minh chứng đính kèm:</label>
                        <div class="attachment-list">
                            <a href="#" class="attachment-item">
                                <i class="fa-solid fa-file-pdf file-icon"></i> xacthucnhucauvinh.pdf • 2mb
                            </a>
                            <a href="#" class="attachment-item">
                                <i class="fa-solid fa-file-pdf file-icon"></i> giaysuquyet-2026.pdf • 1mb
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Progress Bar Section -->
                <div class="progress-section">
                    <div class="progress-label">Tiến độ phân bổ nguồn lực thực tế: <strong>60%</strong></div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 60%;"></div>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="form-actions">
                    <button class="btn-primary" id="saveBtn">Lưu chỉnh sửa</button>
                    <button class="btn-dark" id="verifyBtn">Xác minh ngay</button>
                    <button class="btn-light" id="cancelBtn">Hủy thay đổi</button>
                </div>

            </div>

        </main>
    </div>

    <script src="dvcht2.js"></script>
</body>
</html>
